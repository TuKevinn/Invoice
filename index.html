<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Invoice - Wayan Harta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pustaka html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
      :root {
        --primary: #2563eb;
        --dark-slate: #0f172a;
        --success: #10b981;
        --danger: #ef4444;
        --secondary: #64748b;
        --warning: #f59e0b;
        --border-color: #e2e8f0;
        --share-color: #25D366;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 12px;
        background: #f1f5f9;
        color: #334155;
        -webkit-text-size-adjust: 100%;
      }

      .form-box {
        background: #ffffff;
        padding: 18px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 12px;
      }

      @media (min-width: 600px) {
        .header-group {
          display: grid;
          grid-template-columns: 1.5fr 1fr 1.5fr;
          gap: 12px;
        }
        .item-group {
          display: grid;
          grid-template-columns: 2fr 0.8fr 1.2fr;
          gap: 12px;
        }
      }

      input {
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
        outline: none;
        background-color: #fff;
        -webkit-appearance: none;
      }

      input:focus {
        border-color: var(--primary);
      }

      .btn-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      button {
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-weight: 600;
        flex: 1 1 140px;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        touch-action: manipulation;
      }

      .btn-add-item { background: var(--success); }
      .btn-add-work { background: var(--warning); }
      .btn-print { background: var(--primary); }
      .btn-share-pdf { background: var(--share-color); }

      .invoice-wrapper {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        overflow: hidden;
        padding-bottom: 20px;
      }

      #invoiceArea {
        width: 794px;
        background: white;
        padding: 45px;
        margin: 0 auto;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        box-sizing: border-box;
      }

      .inv-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid var(--dark-slate);
        padding-bottom: 16px;
        margin-bottom: 20px;
      }

      .company-title {
        font-size: 26px;
        font-weight: 700;
        color: var(--dark-slate);
        margin: 0 0 4px 0;
      }

      .company-sub {
        font-size: 13px;
        color: #64748b;
        margin: 2px 0;
      }

      .inv-badge {
        font-size: 28px;
        font-weight: 800;
        color: var(--dark-slate);
        letter-spacing: 1px;
      }

      .client-card {
        background: #f8fafc;
        border: 2px solid #000000;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
      }

      .client-info p {
        margin: 3px 0;
        font-size: 14px;
        color: #000000;
      }

      .client-label {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: #334155;
        margin-bottom: 4px;
      }

      table.table-items {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        margin-bottom: 20px;
        border: 2px solid #000000;
        font-family: "Times New Roman", Times, serif;
      }

      table.table-items thead {
        display: table-header-group;
      }

      table.table-items th {
        background-color: #222222 !important;
        color: #ffffff !important;
        padding: 10px 8px;
        font-weight: bold;
        font-size: 16px;
        text-align: left;
        border: 2px solid #000000;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      table.table-items tr {
        page-break-inside: avoid !important;
      }

      table.table-items td {
        border: 2px solid #000000;
        padding: 10px 8px;
        font-size: 15px;
        color: #000000;
        vertical-align: middle;
        overflow-wrap: break-word;
        word-wrap: break-word;
        word-break: break-word;
      }

      .center { text-align: center; }
      .right { text-align: right; }

      .action-btns {
        margin-top: 4px;
        display: flex;
        gap: 6px;
      }

      .btn-table-action {
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        padding: 3px 8px;
        border-radius: 4px;
      }

      .btn-del { color: var(--danger); background: #fef2f2; }
      .btn-edit { color: var(--primary); background: #eff6ff; }

      .inv-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 16px;
        border-top: 2px solid var(--dark-slate);
        gap: 20px;
        page-break-inside: avoid !important;
      }

      .payment-simple {
        font-size: 12px;
        color: #334155;
        line-height: 1.6;
      }

      .payment-simple-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 4px;
      }

      .total-box {
        text-align: right;
      }

      .total-label {
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
      }

      .total-amount {
        font-size: 24px;
        font-weight: 700;
        color: var(--danger);
        margin-top: 2px;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 15mm 12mm 15mm 12mm;
        }
        
        body {
          background: #ffffff !important;
          padding: 0 !important;
          margin: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        .form-box, .no-export {
          display: none !important;
        }
        
        .invoice-wrapper {
          max-width: 100% !important;
          overflow: visible !important;
          height: auto !important;
        }
        
        #invoiceArea {
          width: 100% !important;
          transform: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        table.table-items th {
          background-color: #222222 !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body>

    <!-- Form Input Data -->
    <div class="form-box">
      <div class="input-group header-group">
        <input type="date" id="tanggal" />
        <input type="text" id="villa" placeholder="Nama Villa / Pembeli" />
        <input type="text" id="alamat" placeholder="Alamat / Lokasi" />
      </div>

      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;" />

      <div class="input-group item-group">
        <input type="text" id="barang" placeholder="Nama Barang" />
        <input type="number" id="qtyBarang" value="1" min="1" placeholder="Qty" />
        <input type="number" id="hargaBarang" placeholder="Harga Satuan" />
      </div>
      <div class="btn-container" style="margin-bottom: 16px;">
        <button class="btn-add-item" onclick="tambahItem('barang')">✚ Tambah Barang</button>
      </div>

      <div class="input-group item-group">
        <input type="text" id="pekerjaan" placeholder="Jenis Pekerjaan / Jasa" />
        <input type="number" id="qtyKerja" value="1" min="1" placeholder="Qty/Unit" />
        <input type="number" id="hargaKerja" placeholder="Harga Jasa" />
      </div>
      <div class="btn-container" style="margin-bottom: 20px;">
        <button class="btn-add-work" onclick="tambahItem('pekerjaan')">+ Tambah Pekerjaan</button>
      </div>

      <div class="btn-container">
        <button class="btn-print" onclick="cetakInvoice()">🖨 Cetak / Simpan ke PDF</button>
        <button class="btn-share-pdf" onclick="sharePDFLangsung()">📲 Bagikan PDF ke WA</button>
      </div>
    </div>

    <!-- Preview Invoice -->
    <div class="invoice-wrapper" id="invoiceScrollWrapper">
      <div id="invoiceArea">
        <div class="inv-header">
          <div>
            <h1 class="company-title">Wayan Harta</h1>
            <p class="company-sub">Jl. Br. Batanduren, Desa Cepaka, Kediri, Tabanan</p>
            <p class="company-sub">Telp/WA: +62 858-5650-6126</p>
          </div>
          <div class="inv-badge">INVOICE</div>
        </div>

        <div class="client-card">
          <div class="client-info">
            <div class="client-label">Ditagih Kepada:</div>
            <p><strong><span id="viewVilla">-</span></strong></p>
            <p><span id="viewAlamat">-</span></p>
          </div>
          <div class="client-info" style="text-align: right;">
            <div class="client-label">Tanggal</div>
            <p><strong><span id="viewTanggal">-</span></strong></p>
          </div>
        </div>

        <table class="table-items">
          <thead>
            <tr>
              <th class="center" style="width: 8%;">No.</th>
              <th style="width: 57%;">Deskripsi Rincian</th>
              <th class="right" style="width: 35%;">Subtotal</th>
            </tr>
          </thead>
          <tbody id="tabelInvoice"></tbody>
        </table>

        <div class="inv-footer">
          <div class="payment-simple">
            <div class="payment-simple-title">Metode Pembayaran</div>
            <div><strong>BNI:</strong> 0583495033 a.n. I WAYAN HARTA WIRAWAN</div>
            <div><strong>BRI:</strong> 740301013521531 a.n. I WAYAN HARTA WIRAWAN</div>
          </div>
          <div class="total-box">
            <div class="total-label">Total Akhir</div>
            <div class="total-amount">Rp <span id="totalHarga">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let total = 0;
      let itemCount = 0;

      function adjustInvoiceScale() {
        const wrapper = document.getElementById("invoiceScrollWrapper");
        const area = document.getElementById("invoiceArea");
        const screenWidth = wrapper.clientWidth;
        const targetWidth = 794;
        
        if (screenWidth < targetWidth) {
          const scale = screenWidth / targetWidth;
          area.style.transform = `scale(${scale})`;
          area.style.transformOrigin = "top left";
          wrapper.style.height = `${area.offsetHeight * scale}px`;
        } else {
          area.style.transform = "none";
          wrapper.style.height = "auto";
        }
      }

      window.addEventListener("resize", adjustInvoiceScale);
      window.addEventListener("DOMContentLoaded", adjustInvoiceScale);

      document.getElementById("tanggal").oninput = (e) =>
        (document.getElementById("viewTanggal").innerText = formatTanggal(e.target.value));
      
      document.getElementById("villa").oninput = (e) => {
        const val = e.target.value.trim();
        document.getElementById("viewVilla").innerText = val || "-";
        
        if (val) {
          document.title = `Invoice - ${val}`;
        } else {
          document.title = "Invoice - Wayan Harta";
        }
      };

      document.getElementById("alamat").oninput = (e) =>
        (document.getElementById("viewAlamat").innerText = e.target.value || "-");

      function tambahItem(tipe) {
        let deskripsiTabel = "";
        let subtotal = 0;
        let namaItem = "";
        let qtyItem = 0;
        let hargaItem = 0;

        if (tipe === "barang") {
          namaItem = document.getElementById("barang").value;
          qtyItem = parseInt(document.getElementById("qtyBarang").value);
          hargaItem = parseInt(document.getElementById("hargaBarang").value);

          if (!namaItem || isNaN(qtyItem) || isNaN(hargaItem)) {
            alert("Lengkapi data barang!");
            return;
          }

          deskripsiTabel = `${namaItem} (${qtyItem} x Rp ${hargaItem.toLocaleString("id-ID")})`;
          subtotal = qtyItem * hargaItem;

          document.getElementById("barang").value = "";
          document.getElementById("hargaBarang").value = "";
          document.getElementById("qtyBarang").value = 1;
        } else {
          namaItem = document.getElementById("pekerjaan").value;
          qtyItem = parseInt(document.getElementById("qtyKerja").value);
          hargaItem = parseInt(document.getElementById("hargaKerja").value);

          if (!namaItem || isNaN(qtyItem) || isNaN(hargaItem)) {
            alert("Lengkapi data pekerjaan!");
            return;
          }

          deskripsiTabel = qtyItem > 1
            ? `JASA: ${namaItem} (${qtyItem} unit x Rp ${hargaItem.toLocaleString("id-ID")})`
            : `JASA: ${namaItem}`;
          subtotal = qtyItem * hargaItem;

          document.getElementById("pekerjaan").value = "";
          document.getElementById("qtyKerja").value = 1;
          document.getElementById("hargaKerja").value = "";
        }

        total += subtotal;
        itemCount++;
        const rowId = "row-" + Date.now();
        const safeNama = namaItem.replace(/'/g, "\\'").replace(/"/g, "&quot;");

        const tbody = document.getElementById("tabelInvoice");
        const newRow = document.createElement("tr");
        newRow.id = rowId;
        newRow.setAttribute("data-subtotal", subtotal);
        newRow.innerHTML = `
            <td class="center cell-no"></td>
            <td>
                <span>${deskripsiTabel}</span>
                <div class="action-btns no-export">
                    <span class="btn-table-action btn-edit" onclick="editBaris('${rowId}', '${tipe}', '${safeNama}', ${qtyItem}, ${hargaItem}, ${subtotal})">✎ Edit</span>
                    <span class="btn-table-action btn-del" onclick="hapusBaris('${rowId}', ${subtotal})">✕ Hapus</span>
                </div>
            </td>
            <td class="right">Rp ${subtotal.toLocaleString("id-ID")}</td>
        `;

        tbody.appendChild(newRow);
        updateNomorUrut();
        updateTotal();
        adjustInvoiceScale();
      }

      function updateNomorUrut() {
        const rows = document.querySelectorAll("#tabelInvoice tr");
        rows.forEach((row, index) => {
          const noCell = row.querySelector(".cell-no");
          if (noCell) noCell.innerText = index + 1;
        });
      }

      function hapusBaris(id, sub) {
        const row = document.getElementById(id);
        if (row) {
          row.remove();
          total -= sub;
          itemCount--;
          updateNomorUrut();
          updateTotal();
          adjustInvoiceScale();
        }
      }

      function editBaris(id, tipe, nama, qty, harga, sub) {
        if (tipe === "barang") {
          document.getElementById("barang").value = nama;
          document.getElementById("qtyBarang").value = qty;
          document.getElementById("hargaBarang").value = harga;
          document.getElementById("barang").focus();
        } else {
          document.getElementById("pekerjaan").value = nama;
          document.getElementById("qtyKerja").value = qty;
          document.getElementById("hargaKerja").value = harga;
          document.getElementById("pekerjaan").focus();
        }
        hapusBaris(id, sub);
      }

      function updateTotal() {
        if (total < 0) total = 0;
        document.getElementById("totalHarga").innerText = total.toLocaleString("id-ID");
      }

      function formatTanggal(t) {
        if (!t) return "-";
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let d = new Date(t);
        return d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
      }

      function cetakInvoice() {
        window.print();
      }

      // Membagikan berkas PDF presisi tinggi (Rapi seperti cetak standar)
      async function sharePDFLangsung() {
        const originalArea = document.getElementById('invoiceArea');
        const namaVillaInput = document.getElementById('villa').value.trim();
        const namaVilla = namaVillaInput || 'Customer';
        const fileName = `Invoice - ${namaVilla}.pdf`;

        if (itemCount === 0) {
          alert("Tabel invoice masih kosong!");
          return;
        }

        // Buat kontainer off-screen sementara untuk rendering tanpa efek scale HP
        const tempContainer = document.createElement('div');
        tempContainer.style.position = 'absolute';
        tempContainer.style.left = '-9999px';
        tempContainer.style.top = '0';
        tempContainer.style.width = '794px';
        
        const clonedArea = originalArea.cloneNode(true);
        clonedArea.style.transform = 'none';
        
        // Hapus elemen tombol edit/hapus pada hasil render PDF
        const actionBtns = clonedArea.querySelectorAll('.no-export');
        actionBtns.forEach(el => el.remove());

        tempContainer.appendChild(clonedArea);
        document.body.appendChild(tempContainer);

        const opt = {
          margin:       [12, 12, 12, 12],
          filename:     fileName,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, windowWidth: 794 },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
          const pdfBlob = await html2pdf().set(opt).from(clonedArea).output('blob');
          const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

          // Hapus kontainer sementara
          document.body.removeChild(tempContainer);

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: `Invoice ${namaVilla}`,
              text: `Berikut file invoice untuk ${namaVilla}.`,
            });
          } else {
            alert("Fitur bagikan berkas langsung biasanya aktif di HP (Android/iOS). File PDF akan diunduh otomatis.");
            html2pdf().set(opt).from(clonedArea).save();
          }
        } catch (error) {
          console.error("Gagal membagikan PDF:", error);
          if (document.body.contains(tempContainer)) {
            document.body.removeChild(tempContainer);
          }
          alert("Terjadi kesalahan saat memproses PDF.");
        }
      }
    </script>
  </body>
</html>
