<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Invoice - Wayan Harta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pustaka PDF Native (jsPDF & AutoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
      :root {
        --primary: #2563eb;
        --dark-slate: #0f172a;
        --success: #10b981;
        --danger: #ef4444;
        --secondary: #64748b;
        --warning: #f59e0b;
        --border-color: #e2e8f0;
        --share-color: #25D366;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 12px;
        background: #f1f5f9;
        color: #334155;
        -webkit-text-size-adjust: 100%;
      }

      .form-box {
        background: #ffffff;
        padding: 18px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 12px;
      }

      @media (min-width: 600px) {
        .header-group {
          display: grid;
          grid-template-columns: 1.5fr 1fr 1.5fr;
          gap: 12px;
        }
        .item-group {
          display: grid;
          grid-template-columns: 2fr 0.8fr 1.2fr;
          gap: 12px;
        }
      }

      input {
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
        outline: none;
        background-color: #fff;
        -webkit-appearance: none;
      }

      input:focus {
        border-color: var(--primary);
      }

      .btn-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      button {
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font-weight: 600;
        flex: 1 1 140px;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        touch-action: manipulation;
      }

      .btn-add-item { background: var(--success); }
      .btn-add-work { background: var(--warning); }
      .btn-print { background: var(--primary); }
      .btn-share-pdf { background: var(--share-color); }

      .invoice-wrapper {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        overflow: hidden;
        padding-bottom: 20px;
      }

      #invoiceArea {
        width: 794px;
        background: white;
        padding: 45px;
        margin: 0 auto;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        box-sizing: border-box;
      }

      .inv-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid var(--dark-slate);
        padding-bottom: 16px;
        margin-bottom: 20px;
      }

      .company-title {
        font-size: 26px;
        font-weight: 700;
        color: var(--dark-slate);
        margin: 0 0 4px 0;
      }

      .company-sub {
        font-size: 13px;
        color: #64748b;
        margin: 2px 0;
      }

      .inv-badge {
        font-size: 28px;
        font-weight: 800;
        color: var(--dark-slate);
        letter-spacing: 1px;
      }

      .client-card {
        background: #f8fafc;
        border: 2px solid #000000;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
      }

      .client-info p {
        margin: 3px 0;
        font-size: 14px;
        color: #000000;
      }

      .client-label {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 700;
        color: #334155;
        margin-bottom: 4px;
      }

      table.table-items {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        margin-bottom: 20px;
        border: 2px solid #000000;
        font-family: "Times New Roman", Times, serif;
      }

      table.table-items thead {
        display: table-header-group;
      }

      table.table-items th {
        background-color: #222222 !important;
        color: #ffffff !important;
        padding: 10px 8px;
        font-weight: bold;
        font-size: 16px;
        text-align: left;
        border: 2px solid #000000;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      table.table-items tr {
        page-break-inside: avoid !important;
      }

      table.table-items td {
        border: 2px solid #000000;
        padding: 10px 8px;
        font-size: 15px;
        color: #000000;
        vertical-align: middle;
        overflow-wrap: break-word;
        word-wrap: break-word;
        word-break: break-word;
      }

      .center { text-align: center; }
      .right { text-align: right; }

      .action-btns {
        margin-top: 4px;
        display: flex;
        gap: 6px;
      }

      .btn-table-action {
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        padding: 3px 8px;
        border-radius: 4px;
      }

      .btn-del { color: var(--danger); background: #fef2f2; }
      .btn-edit { color: var(--primary); background: #eff6ff; }

      .inv-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 16px;
        border-top: 2px solid var(--dark-slate);
        gap: 20px;
        page-break-inside: avoid !important;
      }

      .payment-simple {
        font-size: 12px;
        color: #334155;
        line-height: 1.6;
      }

      .payment-simple-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 4px;
      }

      .total-box {
        text-align: right;
      }

      .total-label {
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
      }

      .total-amount {
        font-size: 24px;
        font-weight: 700;
        color: var(--danger);
        margin-top: 2px;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 15mm 12mm 15mm 12mm;
        }
        
        body {
          background: #ffffff !important;
          padding: 0 !important;
          margin: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        .form-box, .no-export {
          display: none !important;
        }
        
        .invoice-wrapper {
          max-width: 100% !important;
          overflow: visible !important;
          height: auto !important;
        }
        
        #invoiceArea {
          width: 100% !important;
          transform: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        table.table-items th {
          background-color: #222222 !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body>

    <!-- Form Input Data -->
    <div class="form-box">
      <div class="input-group header-group">
        <input type="date" id="tanggal" />
        <input type="text" id="villa" placeholder="Nama Villa / Pembeli" />
        <input type="text" id="alamat" placeholder="Alamat / Lokasi" />
      </div>

      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;" />

      <div class="input-group item-group">
        <input type="text" id="barang" placeholder="Nama Barang" />
        <input type="number" id="qtyBarang" value="1" min="1" placeholder="Qty" />
        <input type="number" id="hargaBarang" placeholder="Harga Satuan" />
      </div>
      <div class="btn-container" style="margin-bottom: 16px;">
        <button class="btn-add-item" onclick="tambahItem('barang')">✚ Tambah Barang</button>
      </div>

      <div class="input-group item-group">
        <input type="text" id="pekerjaan" placeholder="Jenis Pekerjaan / Jasa" />
        <input type="number" id="qtyKerja" value="1" min="1" placeholder="Qty/Unit" />
        <input type="number" id="hargaKerja" placeholder="Harga Jasa" />
      </div>
      <div class="btn-container" style="margin-bottom: 20px;">
        <button class="btn-add-work" onclick="tambahItem('pekerjaan')">+ Tambah Pekerjaan</button>
      </div>

      <div class="btn-container">
        <button class="btn-print" onclick="unduhPDFDirect()">📥 Unduh / Simpan PDF</button>
        <button class="btn-share-pdf" onclick="sharePDFDirect()">📲 Bagikan PDF ke WA</button>
      </div>
    </div>

    <!-- Preview Invoice -->
    <div class="invoice-wrapper" id="invoiceScrollWrapper">
      <div id="invoiceArea">
        <div class="inv-header">
          <div>
            <h1 class="company-title">Wayan Harta</h1>
            <p class="company-sub">Jl. Br. Batanduren, Desa Cepaka, Kediri, Tabanan</p>
            <p class="company-sub">Telp/WA: +62 858-5650-6126</p>
          </div>
          <div class="inv-badge">INVOICE</div>
        </div>

        <div class="client-card">
          <div class="client-info">
            <div class="client-label">Ditagih Kepada:</div>
            <p><strong><span id="viewVilla">-</span></strong></p>
            <p><span id="viewAlamat">-</span></p>
          </div>
          <div class="client-info" style="text-align: right;">
            <div class="client-label">Tanggal</div>
            <p><strong><span id="viewTanggal">-</span></strong></p>
          </div>
        </div>

        <table class="table-items">
          <thead>
            <tr>
              <th class="center" style="width: 8%;">No.</th>
              <th style="width: 57%;">Deskripsi Rincian</th>
              <th class="right" style="width: 35%;">Subtotal</th>
            </tr>
          </thead>
          <tbody id="tabelInvoice"></tbody>
        </table>

        <div class="inv-footer">
          <div class="payment-simple">
            <div class="payment-simple-title">Metode Pembayaran</div>
            <div><strong>BNI:</strong> 0583495033 a.n. I WAYAN HARTA WIRAWAN</div>
            <div><strong>BRI:</strong> 740301013521531 a.n. I WAYAN HARTA WIRAWAN</div>
          </div>
          <div class="total-box">
            <div class="total-label">Total Akhir</div>
            <div class="total-amount">Rp <span id="totalHarga">0</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let total = 0;
      let itemsData = [];

      function adjustInvoiceScale() {
        const wrapper = document.getElementById("invoiceScrollWrapper");
        const area = document.getElementById("invoiceArea");
        const screenWidth = wrapper.clientWidth;
        const targetWidth = 794;
        
        if (screenWidth < targetWidth) {
          const scale = screenWidth / targetWidth;
          area.style.transform = `scale(${scale})`;
          area.style.transformOrigin = "top left";
          wrapper.style.height = `${area.offsetHeight * scale}px`;
        } else {
          area.style.transform = "none";
          wrapper.style.height = "auto";
        }
      }

      window.addEventListener("resize", adjustInvoiceScale);
      window.addEventListener("DOMContentLoaded", adjustInvoiceScale);

      document.getElementById("tanggal").oninput = (e) =>
        (document.getElementById("viewTanggal").innerText = formatTanggal(e.target.value));
      
      document.getElementById("villa").oninput = (e) => {
        const val = e.target.value.trim();
        document.getElementById("viewVilla").innerText = val || "-";
        
        if (val) {
          document.title = `Invoice - ${val}`;
        } else {
          document.title = "Invoice - Wayan Harta";
        }
      };

      document.getElementById("alamat").oninput = (e) =>
        (document.getElementById("viewAlamat").innerText = e.target.value || "-");

      function tambahItem(tipe) {
        let deskripsiTabel = "";
        let subtotal = 0;
        let namaItem = "";
        let qtyItem = 0;
        let hargaItem = 0;

        if (tipe === "barang") {
          namaItem = document.getElementById("barang").value;
          qtyItem = parseInt(document.getElementById("qtyBarang").value);
          hargaItem = parseInt(document.getElementById("hargaBarang").value);

          if (!namaItem || isNaN(qtyItem) || isNaN(hargaItem)) {
            alert("Lengkapi data barang!");
            return;
          }

          deskripsiTabel = `${namaItem} (${qtyItem} x Rp ${hargaItem.toLocaleString("id-ID")})`;
          subtotal = qtyItem * hargaItem;

          document.getElementById("barang").value = "";
          document.getElementById("hargaBarang").value = "";
          document.getElementById("qtyBarang").value = 1;
        } else {
          namaItem = document.getElementById("pekerjaan").value;
          qtyItem = parseInt(document.getElementById("qtyKerja").value);
          hargaItem = parseInt(document.getElementById("hargaKerja").value);

          if (!namaItem || isNaN(qtyItem) || isNaN(hargaItem)) {
            alert("Lengkapi data pekerjaan!");
            return;
          }

          deskripsiTabel = qtyItem > 1
            ? `JASA: ${namaItem} (${qtyItem} unit x Rp ${hargaItem.toLocaleString("id-ID")})`
            : `JASA: ${namaItem}`;
          subtotal = qtyItem * hargaItem;

          document.getElementById("pekerjaan").value = "";
          document.getElementById("qtyKerja").value = 1;
          document.getElementById("hargaKerja").value = "";
        }

        total += subtotal;
        const rowId = "row-" + Date.now();
        const safeNama = namaItem.replace(/'/g, "\\'").replace(/"/g, "&quot;");

        itemsData.push({
          id: rowId,
          deskripsi: deskripsiTabel,
          subtotal: subtotal
        });

        const tbody = document.getElementById("tabelInvoice");
        const newRow = document.createElement("tr");
        newRow.id = rowId;
        newRow.setAttribute("data-subtotal", subtotal);
        newRow.innerHTML = `
            <td class="center cell-no"></td>
            <td>
                <span>${deskripsiTabel}</span>
                <div class="action-btns no-export">
                    <span class="btn-table-action btn-edit" onclick="editBaris('${rowId}', '${tipe}', '${safeNama}', ${qtyItem}, ${hargaItem}, ${subtotal})">✎ Edit</span>
                    <span class="btn-table-action btn-del" onclick="hapusBaris('${rowId}', ${subtotal})">✕ Hapus</span>
                </div>
            </td>
            <td class="right">Rp ${subtotal.toLocaleString("id-ID")}</td>
        `;

        tbody.appendChild(newRow);
        updateNomorUrut();
        updateTotal();
        adjustInvoiceScale();
      }

      function updateNomorUrut() {
        const rows = document.querySelectorAll("#tabelInvoice tr");
        rows.forEach((row, index) => {
          const noCell = row.querySelector(".cell-no");
          if (noCell) noCell.innerText = index + 1;
        });
      }

      function hapusBaris(id, sub) {
        const row = document.getElementById(id);
        if (row) {
          row.remove();
          total -= sub;
          itemsData = itemsData.filter(item => item.id !== id);
          updateNomorUrut();
          updateTotal();
          adjustInvoiceScale();
        }
      }

      function editBaris(id, tipe, nama, qty, harga, sub) {
        if (tipe === "barang") {
          document.getElementById("barang").value = nama;
          document.getElementById("qtyBarang").value = qty;
          document.getElementById("hargaBarang").value = harga;
          document.getElementById("barang").focus();
        } else {
          document.getElementById("pekerjaan").value = nama;
          document.getElementById("qtyKerja").value = qty;
          document.getElementById("hargaKerja").value = harga;
          document.getElementById("pekerjaan").focus();
        }
        hapusBaris(id, sub);
      }

      function updateTotal() {
        if (total < 0) total = 0;
        document.getElementById("totalHarga").innerText = total.toLocaleString("id-ID");
      }

      function formatTanggal(t) {
        if (!t) return "-";
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let d = new Date(t);
        return d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
      }

      // Generator PDF Native menggunakan jsPDF
      function generateNativePDFDoc() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4'
        });

        const villa = document.getElementById("viewVilla").innerText;
        const alamat = document.getElementById("viewAlamat").innerText;
        const tanggal = document.getElementById("viewTanggal").innerText;

        // 1. Header Perusahaan
        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.setTextColor(15, 23, 42);
        doc.text("Wayan Harta", 14, 20);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);
        doc.text("Jl. Br. Batanduren, Desa Cepaka, Kediri, Tabanan", 14, 25);
        doc.text("Telp/WA: +62 858-5650-6126", 14, 29);

        // Header Invoice Badge
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.setTextColor(15, 23, 42);
        doc.text("INVOICE", 196, 22, { align: "right" });

        // Garis Pembatas Header
        doc.setLineWidth(0.6);
        doc.setDrawColor(15, 23, 42);
        doc.line(14, 33, 196, 33);

        // 2. Client Card (Kotak Informasi Pelanggan)
        doc.setFillColor(248, 250, 252);
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.4);
        doc.roundedRect(14, 37, 182, 22, 2, 2, 'FD');

        doc.setFontSize(8);
        doc.setTextColor(51, 65, 85);
        doc.setFont("helvetica", "bold");
        doc.text("DITAGIH KEPADA:", 18, 43);
        doc.text("TANGGAL:", 192, 43, { align: "right" });

        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.text(villa, 18, 48);
        doc.text(tanggal, 192, 48, { align: "right" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(alamat, 18, 53);

        // 3. Tabel Rincian
        const tableBody = itemsData.map((item, index) => [
          index + 1,
          item.deskripsi,
          `Rp ${item.subtotal.toLocaleString("id-ID")}`
        ]);

        doc.autoTable({
          startY: 63,
          head: [['No.', 'Deskripsi Rincian', 'Subtotal']],
          body: tableBody,
          theme: 'grid',
          headStyles: {
            fillColor: [34, 34, 34],
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            fontSize: 10,
            halign: 'left',
            lineWidth: 0.4,
            lineColor: [0, 0, 0]
          },
          columnStyles: {
            0: { halign: 'center', cellWidth: 15 },
            1: { halign: 'left', cellWidth: 117 },
            2: { halign: 'right', cellWidth: 50 }
          },
          bodyStyles: {
            textColor: [0, 0, 0],
            fontSize: 9.5,
            lineWidth: 0.4,
            lineColor: [0, 0, 0]
          },
          styles: { font: "times" },
          margin: { left: 14, right: 14 }
        });

        // 4. Footer & Metode Pembayaran
        let finalY = doc.lastAutoTable.finalY + 8;
        if (finalY > 260) {
          doc.addPage();
          finalY = 20;
        }

        doc.setLineWidth(0.6);
        doc.setDrawColor(15, 23, 42);
        doc.line(14, finalY, 196, finalY);

        finalY += 6;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139);
        doc.text("METODE PEMBAYARAN", 14, finalY);
        doc.text("TOTAL AKHIR", 196, finalY, { align: "right" });

        finalY += 5;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(51, 65, 85);
        doc.text("BNI: 0583495033 a.n. I WAYAN HARTA WIRAWAN", 14, finalY);
        
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.setTextColor(239, 68, 68);
        doc.text(`Rp ${total.toLocaleString("id-ID")}`, 196, finalY + 2, { align: "right" });

        finalY += 5;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(51, 65, 85);
        doc.text("BRI: 740301013521531 a.n. I WAYAN HARTA WIRAWAN", 14, finalY);

        return doc;
      }

      // Fungsi 1: Langsung Unduh & Buka File PDF
      function unduhPDFDirect() {
        if (itemsData.length === 0) {
          alert("Tabel invoice masih kosong!");
          return;
        }
        const namaVillaInput = document.getElementById('villa').value.trim();
        const namaVilla = namaVillaInput || 'Customer';
        const fileName = `Invoice - ${namaVilla}.pdf`;

        const doc = generateNativePDFDoc();
        doc.save(fileName);
      }

      // Fungsi 2: Bagikan File PDF Presisi ke WhatsApp / Perangkat
      async function sharePDFDirect() {
        if (itemsData.length === 0) {
          alert("Tabel invoice masih kosong!");
          return;
        }
        const namaVillaInput = document.getElementById('villa').value.trim();
        const namaVilla = namaVillaInput || 'Customer';
        const fileName = `Invoice - ${namaVilla}.pdf`;

        const doc = generateNativePDFDoc();
        const pdfBlob = doc.output('blob');
        const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: `Invoice ${namaVilla}`,
              text: `Berikut file invoice untuk ${namaVilla}.`
            });
          } catch (err) {
            console.log("Share dibatalkan atau tidak didukung.");
          }
        } else {
          alert("Fitur bagikan berkas langsung aktif di browser HP. File PDF akan diunduh otomatis.");
          doc.save(fileName);
        }
      }
    </script>
  </body>
</html>
